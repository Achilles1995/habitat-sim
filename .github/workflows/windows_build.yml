name: Windows build

on:
  push:
    branches: [windows-port]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheel:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      PYTHONUTF8: "1"
      # CMake 4 rejects bundled sub-projects (e.g. OpenEXR's zlib) that still
      # declare cmake_minimum_required < 3.5; let them configure anyway.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      SCCACHE_GHA_ENABLED: "true"
      # Short build dir to stay clear of the 260-char MAX_PATH limit
      SKBUILD_BUILD_DIR: C:/hb
      CMAKE_GENERATOR: Ninja
      CMAKE_ARGS: >-
        -DCMAKE_C_COMPILER_LAUNCHER=sccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      HABITAT_BUILD_GUI_VIEWERS: "OFF"
      HABITAT_WITH_BULLET: "ON"
      HABITAT_WITH_AUDIO: "OFF"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enable long paths for git
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install build tools
        run: python -m pip install -U pip build scikit-build-core pybind11 ninja cmake

      - name: Build wheel
        shell: pwsh
        run: |
          python -m pip wheel . -w dist --no-deps -v `
            --config-settings=cmake.build-type=Release `
            --config-settings=build-dir=C:/hb `
            --config-settings=build.tool-args=-k0 2>&1 | Tee-Object -FilePath build-log.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Publish build log to ci-logs-build branch
        if: always()
        shell: bash
        run: bash tools/windows/publish_ci_logs.sh ci-logs-build build-log.txt

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: habitat-sim-windows-wheel
          path: dist/*.whl

  # Smoke test + Habitat 3.0 humanoid, with Mesa software OpenGL (no GPU)
  test_wheel:
    needs: build_wheel
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      GALLIUM_DRIVER: llvmpipe
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/download-artifact@v4
        with:
          name: habitat-sim-windows-wheel
          path: dist

      - name: Install wheel
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install (Get-ChildItem dist/*.whl).FullName pytest

      - name: Import test
        shell: bash
        run: |
          set -o pipefail
          python -c "import habitat_sim; print('habitat_sim', habitat_sim.__version__, 'imported OK')" 2>&1 | tee smoke-log.txt

      - name: Install Mesa software OpenGL (runners have no GPU)
        shell: pwsh
        run: |
          gh release download -R pal1000/mesa-dist-win --pattern "*release-msvc.7z" -D mesa
          7z x (Get-ChildItem mesa/*.7z).FullName -omesa/x -y | Out-Null
          $pydir = Split-Path (python -c "import sys; print(sys.executable)")
          Copy-Item mesa/x/x64/*.dll $pydir -Force

      - name: Download test scenes and humanoids
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m habitat_sim.utils.datasets_download --uids habitat_test_scenes habitat_humanoids --data-path data/ --no-replace 2>&1 | tee -a smoke-log.txt
          ls -la data/scene_datasets/habitat-test-scenes data/humanoids/humanoid_data 2>&1 | tee -a smoke-log.txt

      - name: Smoke test (render, physics, datasets)
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tools/windows/smoke_test.py --out smoke 2>&1 | tee -a smoke-log.txt

      - name: Habitat 3.0 humanoid test
        id: humanoid
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tools/windows/humanoid_test.py --out humanoid 2>&1 | tee humanoid-log.txt

      - name: Publish outputs to ci-logs-test branch
        if: always()
        shell: bash
        run: bash tools/windows/publish_ci_logs.sh ci-logs-test smoke smoke-log.txt humanoid humanoid-log.txt

      - name: Fail if a test failed
        if: steps.smoke.outcome != 'success' || steps.humanoid.outcome != 'success'
        run: exit 1

  # Upstream pytest suite on Windows
  pytest:
    needs: build_wheel
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      PYTHONUTF8: "1"
      GALLIUM_DRIVER: llvmpipe
      GH_TOKEN: ${{ github.token }}
      GIT_CLONE_PROTECTION_ACTIVE: "false"
    steps:
      - name: Enable long paths for git
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/download-artifact@v4
        with:
          name: habitat-sim-windows-wheel
          path: dist

      - name: Install wheel and test deps
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install (Get-ChildItem dist/*.whl).FullName pytest pytest-xdist pytest-timeout pytest-benchmark hypothesis
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Mesa software OpenGL (runners have no GPU)
        shell: pwsh
        run: |
          gh release download -R pal1000/mesa-dist-win --pattern "*release-msvc.7z" -D mesa
          7z x (Get-ChildItem mesa/*.7z).FullName -omesa/x -y | Out-Null
          $pydir = Split-Path (python -c "import sys; print(sys.executable)")
          Copy-Item mesa/x/x64/*.dll $pydir -Force

      - name: Download test data
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          git lfs install
          python -m habitat_sim.utils.datasets_download --uids ci_test_assets ycb rearrange_dataset_v2 --replace --data-path data/ --no-prune 2>&1 | tail -200 | tee pytest-data-log.txt

      - name: Run pytest
        id: pytest
        continue-on-error: true
        # step-level limit so the log publishing step below still runs
        timeout-minutes: 240
        shell: bash
        run: |
          set -o pipefail
          # run against the installed wheel, not the source tree
          mv src_python src_python_ignored
          python -m pytest tests -n 4 --timeout 900 -p no:cacheprovider -rfEs \
            --junitxml=pytest-results.xml 2>&1 | tee pytest-log.txt

      - name: Publish outputs to ci-logs-pytest branch
        if: always()
        shell: bash
        run: bash tools/windows/publish_ci_logs.sh ci-logs-pytest pytest-log.txt pytest-results.xml pytest-data-log.txt

      - name: Fail if pytest failed
        if: steps.pytest.outcome != 'success'
        run: exit 1

  # Habitat-Lab (patched for Windows) running the Habitat 3.0 humanoid task
  habitat_lab:
    needs: build_wheel
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      GALLIUM_DRIVER: llvmpipe
      GH_TOKEN: ${{ github.token }}
      GIT_CLONE_PROTECTION_ACTIVE: "false"
      HABITAT_LAB_SHA: 0fb6f43ffe806a8088a171b036336c093bcf604e
      MAGNUM_LOG: quiet
      HABITAT_SIM_LOG: quiet
    steps:
      - name: Enable long paths for git
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          path: habitat-sim

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/download-artifact@v4
        with:
          name: habitat-sim-windows-wheel
          path: dist

      - name: Install Mesa software OpenGL (runners have no GPU)
        shell: pwsh
        run: |
          gh release download -R pal1000/mesa-dist-win --pattern "*release-msvc.7z" -D mesa
          7z x (Get-ChildItem mesa/*.7z).FullName -omesa/x -y | Out-Null
          $pydir = Split-Path (python -c "import sys; print(sys.executable)")
          Copy-Item mesa/x/x64/*.dll $pydir -Force

      - name: Install habitat-sim wheel and patched habitat-lab
        shell: bash
        run: |
          set -ex
          python -m pip install -U pip
          # habitat-lab pins numpy 1.26.4; install habitat-sim's deps against it
          echo "numpy==1.26.4" > constraints.txt
          python -m pip install -c constraints.txt numpy attrs gitpython imageio imageio-ffmpeg matplotlib numba numpy-quaternion "pillow==10.4.0" scipy tqdm psutil
          python -m pip install --no-deps dist/*.whl
          git clone -q https://github.com/facebookresearch/habitat-lab.git habitat-lab
          cd habitat-lab
          git checkout -q "$HABITAT_LAB_SHA"
          git apply --verbose ../habitat-sim/tools/windows/habitat-lab-windows.patch
          python -m pip install -c ../constraints.txt -e habitat-lab -e habitat-baselines
          python -c "import habitat, habitat_baselines, habitat_sim, numpy; print('habitat-lab OK', habitat.__version__, 'numpy', numpy.__version__)"

      - name: Download Habitat 3.0 benchmark assets
        continue-on-error: true
        shell: bash
        working-directory: habitat-lab
        run: |
          set -o pipefail
          git lfs install
          python -m habitat_sim.utils.datasets_download --uids hab3_bench_assets ycb --data-path data/ --no-replace 2>&1 | tail -40 | tee ../hab3-data-log.txt

      - name: Habitat 3.0 humanoid episode + VectorEnv
        id: hab3
        continue-on-error: true
        shell: bash
        working-directory: habitat-lab
        run: |
          set -o pipefail
          python ../habitat-sim/tools/windows/hab3_humanoid_episode.py --out ../hab3 2>&1 | tee ../hab3-log.txt

      - name: Habitat 3.0 benchmark (humanoid oracle, 1 process)
        id: bench
        continue-on-error: true
        shell: bash
        working-directory: habitat-lab
        run: |
          set -o pipefail
          python scripts/hab3_bench/hab3_benchmark.py --cfg benchmark/rearrange/hab3_bench/humanoid_oracle.yaml \
            --n-steps 300 --n-procs 1 --out-name human_oracle_win \
            habitat.task.task_spec=tidy_house_2obj habitat.task.pddl_domain_def=fp \
            habitat.dataset.data_path=data/hab3_bench_assets/episode_datasets/small_small.json.gz 2>&1 | tail -40 | tee ../hab3-bench-log.txt

      - name: Publish outputs to ci-logs-lab branch
        if: always()
        shell: bash
        run: bash habitat-sim/tools/windows/publish_ci_logs.sh ci-logs-lab hab3 hab3-log.txt hab3-bench-log.txt hab3-data-log.txt

      - name: Fail if a step failed
        if: steps.hab3.outcome != 'success' || steps.bench.outcome != 'success'
        run: exit 1
