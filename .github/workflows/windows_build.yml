name: Windows build

on:
  push:
    branches: [windows-port]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheel:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    timeout-minutes: 360
    env:
      PYTHONUTF8: "1"
      # CMake 4 rejects bundled sub-projects (e.g. OpenEXR's zlib) that still
      # declare cmake_minimum_required < 3.5; let them configure anyway.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      SCCACHE_GHA_ENABLED: "true"
      # Short build dir to stay clear of the 260-char MAX_PATH limit
      SKBUILD_BUILD_DIR: C:/hb
      CMAKE_GENERATOR: Ninja
      CMAKE_ARGS: >-
        -DCMAKE_C_COMPILER_LAUNCHER=sccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      HABITAT_BUILD_GUI_VIEWERS: "OFF"
      HABITAT_WITH_BULLET: "ON"
      HABITAT_WITH_AUDIO: "OFF"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enable long paths for git
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install build tools
        run: python -m pip install -U pip build scikit-build-core pybind11 ninja cmake

      - name: Build wheel
        shell: pwsh
        run: |
          python -m pip wheel . -w dist --no-deps -v `
            --config-settings=cmake.build-type=Release `
            --config-settings=build-dir=C:/hb `
            --config-settings=build.tool-args=-k0 2>&1 | Tee-Object -FilePath build-log.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Publish build log to ci-logs-build branch
        shell: bash
        if: always() && matrix.python == '3.10'
        run: bash tools/windows/publish_ci_logs.sh ci-logs-build build-log.txt

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: habitat-sim-windows-wheel-py${{ matrix.python }}
          path: dist/*.whl

      - name: Publish wheel to the windows-wheel-latest release
        continue-on-error: true   # concurrent uploads from the matrix can race; the artifact is what tests use
        shell: bash
        run: |
          set -e
          tag=windows-wheel-latest
          printf "habitat-sim Windows wheel\nbranch: %s\ncommit: %s\nrun: %s/%s/actions/runs/%s\n" \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > dist/BUILD_INFO.txt
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "Habitat-Sim for Windows (latest CI build)" \
              --notes "Unofficial Windows build of habitat-sim from the windows-port work. x64, Bullet physics; wheels for Python 3.10, 3.11 and 3.12. See BUILD_INFO.txt for the exact commit."
          fi
          gh release upload "$tag" dist/*.whl dist/BUILD_INFO.txt -R "$GITHUB_REPOSITORY" --clobber

  # Smoke test + Habitat 3.0 humanoid, with Mesa software OpenGL (no GPU)
  test_wheel:
    needs: build_wheel
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      GALLIUM_DRIVER: llvmpipe
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          name: habitat-sim-windows-wheel-py${{ matrix.python }}
          path: dist

      - name: Install wheel
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install (Get-ChildItem dist/*.whl).FullName pytest

      - name: Import test
        shell: bash
        run: |
          set -o pipefail
          python -c "import habitat_sim; print('habitat_sim', habitat_sim.__version__, 'imported OK')" 2>&1 | tee smoke-log.txt

      - name: Install Mesa software OpenGL (runners have no GPU)
        shell: pwsh
        run: |
          gh release download -R pal1000/mesa-dist-win --pattern "*release-msvc.7z" -D mesa
          7z x (Get-ChildItem mesa/*.7z).FullName -omesa/x -y | Out-Null
          $pydir = Split-Path (python -c "import sys; print(sys.executable)")
          Copy-Item mesa/x/x64/*.dll $pydir -Force

      - name: Download test scenes and humanoids
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m habitat_sim.utils.datasets_download --uids habitat_test_scenes habitat_humanoids --data-path data/ --no-replace 2>&1 | tee -a smoke-log.txt
          ls -la data/scene_datasets/habitat-test-scenes data/humanoids/humanoid_data 2>&1 | tee -a smoke-log.txt

      - name: Smoke test (render, physics, datasets)
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tools/windows/smoke_test.py --out smoke 2>&1 | tee -a smoke-log.txt

      - name: Habitat 3.0 humanoid test
        id: humanoid
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tools/windows/humanoid_test.py --out humanoid 2>&1 | tee humanoid-log.txt

      - name: Publish outputs to ci-logs-test branch
        if: always()
        shell: bash
        run: bash tools/windows/publish_ci_logs.sh ci-logs-test-py${{ matrix.python }} smoke smoke-log.txt humanoid humanoid-log.txt

      - name: Fail if a test failed
        if: steps.smoke.outcome != 'success' || steps.humanoid.outcome != 'success'
        run: exit 1

  # Upstream pytest suite on Windows
  pytest:
    needs: build_wheel
    # long (2-4 h); only on the main port branch, not on dev branches
    if: github.ref == 'refs/heads/windows-port'
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      PYTHONUTF8: "1"
      GALLIUM_DRIVER: llvmpipe
      GH_TOKEN: ${{ github.token }}
      GIT_CLONE_PROTECTION_ACTIVE: "false"
    steps:
      - name: Enable long paths for git
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/download-artifact@v4
        with:
          name: habitat-sim-windows-wheel-py3.10
          path: dist

      - name: Install wheel and test deps
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install (Get-ChildItem dist/*.whl).FullName pytest pytest-xdist pytest-timeout pytest-benchmark hypothesis
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Mesa software OpenGL (runners have no GPU)
        shell: pwsh
        run: |
          gh release download -R pal1000/mesa-dist-win --pattern "*release-msvc.7z" -D mesa
          7z x (Get-ChildItem mesa/*.7z).FullName -omesa/x -y | Out-Null
          $pydir = Split-Path (python -c "import sys; print(sys.executable)")
          Copy-Item mesa/x/x64/*.dll $pydir -Force

      - name: Download test data
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          git lfs install
          python -m habitat_sim.utils.datasets_download --uids ci_test_assets ycb rearrange_dataset_v2 --replace --data-path data/ --no-prune 2>&1 | tail -200 | tee pytest-data-log.txt

      - name: Run pytest
        id: pytest
        continue-on-error: true
        # step-level limit so the log publishing step below still runs
        timeout-minutes: 240
        shell: bash
        run: |
          set -o pipefail
          # run against the installed wheel, not the source tree
          mv src_python src_python_ignored
          python -m pytest tests -n 4 --timeout 900 -p no:cacheprovider -rfEs \
            --junitxml=pytest-results.xml 2>&1 | tee pytest-log.txt

      - name: Publish outputs to ci-logs-pytest branch
        if: always()
        shell: bash
        run: bash tools/windows/publish_ci_logs.sh ci-logs-pytest pytest-log.txt pytest-results.xml pytest-data-log.txt

      - name: Fail if pytest failed
        if: steps.pytest.outcome != 'success'
        run: exit 1

  # Habitat-Lab (patched for Windows) running the Habitat 3.0 humanoid task
  habitat_lab:
    needs: build_wheel
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      GALLIUM_DRIVER: llvmpipe
      GH_TOKEN: ${{ github.token }}
      GIT_CLONE_PROTECTION_ACTIVE: "false"
      HABITAT_LAB_SHA: 0fb6f43ffe806a8088a171b036336c093bcf604e
      MAGNUM_LOG: quiet
      HABITAT_SIM_LOG: quiet
    steps:
      - name: Enable long paths for git
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          path: habitat-sim

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/download-artifact@v4
        with:
          name: habitat-sim-windows-wheel-py3.10
          path: dist

      - name: Install Mesa software OpenGL (runners have no GPU)
        shell: pwsh
        run: |
          gh release download -R pal1000/mesa-dist-win --pattern "*release-msvc.7z" -D mesa
          7z x (Get-ChildItem mesa/*.7z).FullName -omesa/x -y | Out-Null
          $pydir = Split-Path (python -c "import sys; print(sys.executable)")
          Copy-Item mesa/x/x64/*.dll $pydir -Force

      - name: Install habitat-sim wheel and patched habitat-lab
        id: install
        shell: bash
        run: |
          exec > >(tee lab-install-log.txt) 2>&1
          set -ex
          python -m pip install -U pip
          # habitat-lab pins numpy 1.26.4; install habitat-sim's deps against it
          echo "numpy==1.26.4" > constraints.txt
          python -m pip install -c constraints.txt numpy attrs gitpython imageio imageio-ffmpeg matplotlib numba numpy-quaternion "pillow==10.4.0" scipy tqdm psutil
          python -m pip install --no-deps dist/*.whl
          git clone -q https://github.com/facebookresearch/habitat-lab.git habitat-lab
          cd habitat-lab
          git checkout -q "$HABITAT_LAB_SHA"
          git apply --verbose ../habitat-sim/tools/windows/habitat-lab-windows.patch
          python -m pip install -c ../constraints.txt -e habitat-lab -e habitat-baselines
          python -c "import habitat, habitat_baselines, habitat_sim, numpy; print('habitat-lab OK', habitat.__version__, 'numpy', numpy.__version__)"

      - name: Download Habitat 3.0 benchmark assets
        continue-on-error: true
        shell: bash
        working-directory: habitat-lab
        run: |
          set -o pipefail
          git lfs install
          python -m habitat_sim.utils.datasets_download --uids hab3_bench_assets ycb --data-path data/ --no-replace 2>&1 | tail -40 | tee ../hab3-data-log.txt

      - name: Habitat 3.0 humanoid episode + VectorEnv
        id: hab3
        continue-on-error: true
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
        working-directory: habitat-lab
        run: |
          set -o pipefail
          python ../habitat-sim/tools/windows/hab3_humanoid_episode.py --out ../hab3 2>&1 | tee ../hab3-log.txt

      - name: Habitat 3.0 benchmark (humanoid oracle, 1 process)
        id: bench
        continue-on-error: true
        shell: bash
        working-directory: habitat-lab
        run: |
          set -o pipefail
          python scripts/hab3_bench/hab3_benchmark.py --cfg benchmark/rearrange/hab3_bench/humanoid_oracle.yaml \
            --n-steps 300 --n-procs 1 --out-name human_oracle_win \
            habitat.task.task_spec=tidy_house_2obj habitat.task.pddl_domain_def=fp \
            habitat.dataset.data_path=data/hab3_bench_assets/episode_datasets/small_small.json.gz \
            habitat.dataset.scenes_dir=data/hab3_bench_assets 2>&1 | tail -40 | tee ../hab3-bench-log.txt

      - name: Publish outputs to ci-logs-lab branch
        if: always()
        shell: bash
        run: bash habitat-sim/tools/windows/publish_ci_logs.sh ci-logs-lab hab3 hab3-log.txt hab3-bench-log.txt hab3-data-log.txt lab-install-log.txt

      - name: Fail if a step failed
        if: steps.hab3.outcome != 'success' || steps.bench.outcome != 'success'
        run: exit 1

  # Run the exact script users run on their own PC (tools/windows/gpu_test.ps1),
  # in Windows PowerShell 5.1, with Mesa standing in for an NVIDIA GPU.
  gpu_script:
    needs: build_wheel
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      GALLIUM_DRIVER: llvmpipe
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Mesa software OpenGL next to python.exe
        shell: pwsh
        run: |
          gh release download -R pal1000/mesa-dist-win --pattern "*release-msvc.7z" -D mesa
          7z x (Get-ChildItem mesa/*.7z).FullName -omesa/x -y | Out-Null
          $pydir = Split-Path (py -3.10 -c "import sys; print(sys.executable)")
          Copy-Item mesa/x/x64/*.dll $pydir -Force

      - name: Run gpu_test.ps1 (as a user would)
        id: script
        continue-on-error: true
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\windows\gpu_test.ps1 -Dir C:\ht -Branch $env:GITHUB_REF_NAME -WithHabitatLab
          if (-not (Test-Path C:\ht\habitat_gpu_test_results.zip)) { exit 1 }
          Get-Content C:\ht\results\summary.txt
          if (Select-String -Path C:\ht\results\summary.txt -Pattern "FAIL") { exit 1 }

      - name: Publish outputs to ci-logs-script branch
        if: always()
        shell: bash
        run: |
          mkdir -p script-out
          cp -r /c/ht/results/* script-out/ 2>/dev/null || true
          bash tools/windows/publish_ci_logs.sh ci-logs-script script-out/*

      - name: Fail if the script failed
        if: steps.script.outcome != 'success'
        run: exit 1

  # Live viewer (tools/windows/interactive_viewer.py) driven by a scripted key sequence
  viewer:
    needs: build_wheel
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      GALLIUM_DRIVER: llvmpipe
      GH_TOKEN: ${{ github.token }}
      GIT_CLONE_PROTECTION_ACTIVE: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: habitat-sim-windows-wheel-py3.12
          path: dist

      - name: Install wheel + OpenCV
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install (Get-ChildItem dist/*.whl).FullName opencv-python

      - name: Install Mesa software OpenGL (runners have no GPU)
        shell: pwsh
        run: |
          gh release download -R pal1000/mesa-dist-win --pattern "*release-msvc.7z" -D mesa
          7z x (Get-ChildItem mesa/*.7z).FullName -omesa/x -y | Out-Null
          $pydir = Split-Path (python -c "import sys; print(sys.executable)")
          Copy-Item mesa/x/x64/*.dll $pydir -Force

      - name: Download scenes, humanoids, Spot
        shell: bash
        run: |
          git lfs install
          python -m habitat_sim.utils.datasets_download --uids habitat_test_scenes habitat_humanoids hab_spot_arm --data-path data/ --no-replace 2>&1 | tail -20

      - name: Viewer self-test
        id: viewer
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tools/windows/interactive_viewer.py --robot spot --selftest 400 --out viewer-out 2>&1 | grep -v "^\s*GL_\|^Using\|^\s*mesa-\|^\s*no-" | tail -60 | tee viewer-log.txt

      - name: Viewer in an HSSD house (Habitat 3.0 benchmark subset)
        id: hssd
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m habitat_sim.utils.datasets_download --uids hab3_bench_assets --data-path data/ --no-replace 2>&1 | tail -5
          ds=$(find -L data/hab3_bench_assets -name "*.scene_dataset_config.json" | head -1)
          echo "dataset: $ds" | tee hssd-log.txt
          python tools/windows/interactive_viewer.py --dataset "$ds" --list-scenes 2>&1 | grep -v "Warning\|Error\|SSD" | tee -a hssd-log.txt
          scene=$(python tools/windows/interactive_viewer.py --dataset "$ds" --list-scenes 2>/dev/null | grep -v "scenes$" | head -1)
          echo "scene: $scene" | tee -a hssd-log.txt
          {
            echo "== dataset configs:"; find -L data/hab3_bench_assets -name "*.scene_dataset_config.json"
            echo "== $ds:"; cat "$ds"
            echo "== hab3-hssd top level:"; ls -la "$(dirname "$ds")"
            echo "== semantic files:"; find -L "$(dirname "$ds")/.." -maxdepth 3 \( -iname "*semantic*" -o -iname "*ssd*" -o -iname "*lexicon*" \) | head -20
            echo "== scene instance file:"; si=$(find -L "$(dirname "$ds")" -name "${scene}*.scene_instance.json" | head -1); echo "$si"; head -c 1500 "$si"; echo
            echo "== semantics folder:"; find -L "$(dirname "$ds")/semantics" | head -20
            echo "== a semantic config:"; f=$(find -L "$(dirname "$ds")/semantics" -name "*.json" | head -1); echo "$f"; head -c 800 "$f"; echo
            echo "== registered semantic attributes:"; python -c "import habitat_sim,sys; c=habitat_sim.SimulatorConfiguration(); c.scene_dataset_config_file=sys.argv[1]; mm=habitat_sim.metadata.MetadataMediator(c); m=getattr(mm,'semantic_template_manager',None) or getattr(mm,'semantic_attributes_manager',None); print('manager:', m); print(m.get_template_handles() if m else 'no python access')" "$ds" 2>&1 | grep -v Warning
            echo "== episodes reference:"; python -c "import gzip,json,glob; f=sorted(glob.glob('data/hab3_bench_assets/episode_datasets/*.json.gz'))[0]; e=json.load(gzip.open(f))['episodes'][0]; print(f, e.get('scene_dataset_config'), e.get('scene_id'))"
          } 2>&1 | tee -a hssd-log.txt
          python tools/windows/interactive_viewer.py --dataset "$ds" --scene "$scene" --robot spot --selftest 400 --out hssd-out 2>&1 \
            | grep -v "^\s*GL_\|^Using\|^\s*mesa-\|^\s*no-\|Warning\|SSD" | tail -30 | tee -a hssd-log.txt

      - name: Publish outputs to ci-logs-viewer branch
        if: always()
        shell: bash
        run: bash tools/windows/publish_ci_logs.sh ci-logs-viewer viewer-out viewer-log.txt hssd-out hssd-log.txt

      - name: Fail if the viewer failed
        if: steps.viewer.outcome != 'success' || steps.hssd.outcome != 'success'
        run: exit 1

  evk4:
    needs: build_wheel
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      PYTHONUTF8: "1"
      GALLIUM_DRIVER: llvmpipe
      GH_TOKEN: ${{ github.token }}
      GIT_CLONE_PROTECTION_ACTIVE: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: habitat-sim-windows-wheel-py3.12
          path: dist

      - name: Install wheel + EVK4 dependencies (Warp runs on the CPU here)
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install (Get-ChildItem dist/*.whl).FullName opencv-python mujoco "warp-lang<1.18" scipy imageio imageio-ffmpeg

      - name: Install Mesa software OpenGL (runners have no GPU)
        shell: pwsh
        run: |
          gh release download -R pal1000/mesa-dist-win --pattern "*release-msvc.7z" -D mesa
          7z x (Get-ChildItem mesa/*.7z).FullName -omesa/x -y | Out-Null
          $pydir = Split-Path (python -c "import sys; print(sys.executable)")
          Copy-Item mesa/x/x64/*.dll $pydir -Force

      - name: Download scenes, humanoids, Spot
        shell: bash
        run: |
          git lfs install
          python -m habitat_sim.utils.datasets_download --uids habitat_test_scenes habitat_humanoids hab_spot_arm --data-path data/ --no-replace 2>&1 | tail -5

      - name: EVK4 photon chain (analytic scene)
        id: chain
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evk4-out
          python evk4/tests/test_habitat_chain.py 2>&1 | tee evk4-out/chain-log.txt

      - name: Humanoid action poses (contact sheet)
        continue-on-error: true
        shell: bash
        run: |
          python evk4/tests/test_poses.py --data data --out evk4-out 2>&1 | grep -v "Warning\]\|Error\]\|^\s*GL_\|^Using\|^\s*mesa-\|^\s*no-" | tail -20 | tee evk4-out/poses-log.txt

      - name: EVK4 in a Habitat scene (humanoid, Spot, wall camera)
        id: scene
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python evk4/tests/test_habitat_scene.py --data data --out evk4-out 2>&1 | grep -v "^\s*GL_\|^Using\|^\s*mesa-\|^\s*no-\|incompatible light setup" | tail -80 | tee evk4-out/scene-log.txt

      - name: HRC datasets (1 short episode per application) + 1-epoch training
        id: hrc
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pip install torch h5py 2>&1 | tail -1
          cp data/humanoids/humanoid_data/female_2/female_2.urdf evk4-out/ 2>/dev/null || true
          ls data/humanoids/humanoid_data | tee evk4-out/humanoids.txt
          F="^\s*GL_\|^Using\|^\s*mesa-\|^\s*no-\|incompatible light setup"
          python evk4/tools/hrc_generate.py safety --data data --episodes 1 --seconds 4 --binning 8 \
              --out evk4-out/ds --preview --png-every 15 2>&1 | grep -v "$F" | tail -40 | tee evk4-out/hrc-log.txt
          python evk4/tools/hrc_generate.py actions --data data --episodes 1 --binning 8 --fall-prob 1 \
              --out evk4-out/ds --preview 2>&1 | grep -v "$F" | tail -40 | tee -a evk4-out/hrc-log.txt
          python -m habitat_sim.utils.datasets_download --uids hab3_bench_assets --data-path data/ --no-replace 2>&1 | tail -2
          ds=$(find -L data/hab3_bench_assets -name "*.scene_dataset_config.json" | head -1)
          python evk4/tools/hrc_generate.py actions --data data --dataset "$ds" --scene 102816009 --episodes 1 --first 1 \
              --binning 8 --fall-prob 1 --out evk4-out/ds --preview 2>&1 | grep -v "$F" | tail -40 | tee -a evk4-out/hrc-log.txt
          for ep in evk4-out/ds/actions/ep*; do for cam in spot_head wall0; do
            python evk4/tools/hrc_inspect.py $ep --cam $cam --out $ep/sync_$cam.png 2>&1 | tail -2 | tee -a evk4-out/hrc-log.txt
          done; done
          python evk4/tools/hrc_train.py actions --root evk4-out/ds/actions --epochs 1 --out evk4-out/run_actions \
              --size 80x45 --modality both 2>&1 | tail -40 | tee -a evk4-out/hrc-log.txt
          python evk4/tools/hrc_generate.py safety --data data --episodes 1 --first 1 --seconds 4 --binning 8 \
              --out evk4-out/ds 2>&1 | grep -v "$F" | tail -5 | tee -a evk4-out/hrc-log.txt
          python evk4/tools/hrc_train.py safety --root evk4-out/ds/safety --epochs 1 --out evk4-out/run_safety \
              --size 80x45 2>&1 | tail -40 | tee -a evk4-out/hrc-log.txt
          find evk4-out/ds -name "*.h5" -size +40M -delete

      - name: Publish outputs to ci-logs-evk4 branch
        if: always()
        shell: bash
        run: bash tools/windows/publish_ci_logs.sh ci-logs-evk4 evk4-out

      - name: Fail if a check failed
        if: steps.chain.outcome != 'success' || steps.scene.outcome != 'success' || steps.hrc.outcome != 'success'
        run: exit 1
