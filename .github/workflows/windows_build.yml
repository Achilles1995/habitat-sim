name: Windows build

on:
  push:
    branches: [windows-port]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheel:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      PYTHONUTF8: "1"
      # CMake 4 rejects bundled sub-projects (e.g. OpenEXR's zlib) that still
      # declare cmake_minimum_required < 3.5; let them configure anyway.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      SCCACHE_GHA_ENABLED: "true"
      # Short build dir to stay clear of the 260-char MAX_PATH limit
      SKBUILD_BUILD_DIR: C:/hb
      CMAKE_GENERATOR: Ninja
      CMAKE_ARGS: >-
        -DCMAKE_C_COMPILER_LAUNCHER=sccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      HABITAT_BUILD_GUI_VIEWERS: "OFF"
      HABITAT_WITH_BULLET: "ON"
      HABITAT_WITH_AUDIO: "OFF"
    steps:
      - name: Enable long paths for git
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install build tools
        run: python -m pip install -U pip build scikit-build-core pybind11 ninja cmake

      - name: Build wheel
        shell: pwsh
        run: |
          python -m pip wheel . -w dist --no-deps -v `
            --config-settings=cmake.build-type=Release `
            --config-settings=build-dir=C:/hb 2>&1 | Tee-Object -FilePath build-log.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt

      - name: Publish build log to ci-logs-build branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          out="$RUNNER_TEMP/publish"
          rm -rf "$out" && mkdir -p "$out"
          if [ -f build-log.txt ]; then
            grep -nE "error|FAILED|CMake Error|fatal" build-log.txt | grep -viE "warning|-Werror|error_code|errors\.h|_error\.|Error\.cpp|Error\.h|/WX" | head -400 > "$out/errors.txt" || true
            tail -n 3000 build-log.txt > "$out/tail.txt"
            gzip -c build-log.txt > "$out/build-log.txt.gz"
          fi
          cd "$out"
          echo "run $GITHUB_RUN_ID sha $GITHUB_SHA" > RUN.txt
          git init -q && git checkout -q -b tmp
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "build logs for run $GITHUB_RUN_ID ($GITHUB_SHA)"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" tmp:ci-logs-build

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: habitat-sim-windows-wheel
          path: dist/*.whl

  test_wheel:
    needs: build_wheel
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      GALLIUM_DRIVER: llvmpipe
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/download-artifact@v4
        with:
          name: habitat-sim-windows-wheel
          path: dist

      - name: Install wheel
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install (Get-ChildItem dist/*.whl).FullName pytest

      - name: Import test
        shell: bash
        run: |
          set -o pipefail
          python -c "import habitat_sim; print('habitat_sim', habitat_sim.__version__, 'imported OK')" 2>&1 | tee smoke-log.txt

      - name: Install Mesa software OpenGL (runners have no GPU)
        shell: pwsh
        run: |
          gh release download -R pal1000/mesa-dist-win --pattern "*release-msvc.7z" -D mesa
          7z x (Get-ChildItem mesa/*.7z).FullName -omesa/x -y | Out-Null
          $pydir = Split-Path (python -c "import sys; print(sys.executable)")
          Copy-Item mesa/x/x64/*.dll $pydir -Force
          Get-ChildItem $pydir -Filter *.dll | Select-Object Name

      - name: Offscreen rendering smoke test (WGL)
        shell: bash
        run: |
          set -o pipefail
          python tools/windows/smoke_test.py --out smoke 2>&1 | tee -a smoke-log.txt

      - name: Upload smoke test images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-output
          path: smoke

      - name: Publish smoke test output to ci-logs-test branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          out="$RUNNER_TEMP/publish"
          rm -rf "$out" && mkdir -p "$out"
          cp -r smoke "$out/" 2>/dev/null || true
          cp smoke-log.txt "$out/" 2>/dev/null || true
          cd "$out"
          echo "run $GITHUB_RUN_ID sha $GITHUB_SHA" > RUN.txt
          git init -q && git checkout -q -b tmp
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "test logs for run $GITHUB_RUN_ID ($GITHUB_SHA)"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" tmp:ci-logs-test
